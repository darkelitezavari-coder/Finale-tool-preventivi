    <style>

        html { scroll-behavior: smooth; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); }
        h1, h2, h3, h4, .font-display { font-family: 'Playfair Display', serif; }
        .step-view { display: none; }
        .step-view.active { display: block; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1, transform: translateY(0); } }
        .card { background-color: var(--bg-secondary); border: 1px solid #374151; transition: all 0.3s ease; }
        .card.interactive:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 500; transition: all 0.2s; cursor: pointer; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: var(--accent); color: var(--bg-primary); }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-secondary:hover { background-color: var(--accent); color: var(--bg-primary); }
        .modal { background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .input-field { background-color: var(--bg-secondary); border: 1px solid #374151; color: var(--text-primary); padding: 0.75rem; border-radius: 0.375rem; }
        textarea.input-field { min-height: 120px; }
        [contenteditable]:focus { outline: 2px solid var(--accent); background-color: #374151; border-radius: 4px; padding: 0 4px; }
        
        .loader { width: 48px; height: 48px; border: 5px solid var(--text-primary); border-bottom-color: var(--accent); border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media print {
            body { background-color: white !important; }
            #app, .no-print { display: none !important; }
            #quote-modal { 
                display: flex !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;

                background-color: transparent !important;
                backdrop-filter: none !important;
                justify-content: flex-start;

            }

            [contenteditable="true"] {

                const apiKey = "gen-lang-client-0227873484"; 

                // !!! MODIFICA 2: URL DELL'API CORRETTO !!!
                // Ho aggiornato il nome del modello a "gemini-1.5-flash" che è più recente e corretto.
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                if (expectJson) { payload.generationConfig = { responseMimeType: "application/json" }; }
                try {
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) { const errorBody = await response.text(); throw new Error(`API Error: ${response.statusText} - ${errorBody}`); }
                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;
                    return expectJson ? JSON.parse(text) : text;
                } catch (error) {
                    console.error("Errore chiamata Gemini API:", error);

                 2.  **Consigli Sul Campo:** Quale approccio tecnico e relazionale deve adottare il fotografo?
                 3.  **Workflow di Post-Produzione:** Quali sono i passaggi chiave per elaborare le immagini di questo servizio?
                 
                 Sii specifico e fai riferimento all'attrezzatura quando possibile. Formatta il testo con titoli in grassetto e elenchi puntati.`;
                 const result = await callGeminiAPI(prompt); 
                 state.currentVademecum = result;
                 container.innerHTML = `<div class="prose prose-invert text-left whitespace-pre-wrap">${result}</div>`;
            };
            const handleCalculateAiPrice = async () => {
                const description = document.getElementById('ai-job-description').value;
                if (!description || description.length < 20) { alert("Per favore, fornisci una descrizione più dettagliata del lavoro (almeno 20 caratteri)."); return; }
                const resultContainer = document.getElementById('ai-form-container');
                resultContainer.innerHTML = '<div class="flex justify-center items-center p-4 h-64"><span class="loader"></span></div>';
                const pricingContext = JSON.stringify( Object.keys(DATABASE).reduce((acc, key) => { if (key !== 'su-misura') acc[key] = { packages: DATABASE[key].packages }; return acc; }, {}) );
                const prompt = `Sei un consulente esperto per fotografi professionisti in Italia. Il fotografo che assisti si chiama ${CONFIG.photographerName}. La sua attrezzatura è:\n${CONFIG.equipment}\nAnalizza la seguente richiesta di lavoro e, basandoti sulla struttura prezzi fornita come contesto, crea una proposta commerciale completa. **Struttura Prezzi di Riferimento (in JSON):** ${pricingContext} **Descrizione del Lavoro:** "${description}" **Output Richiesto (solo JSON):** Fornisci la tua risposta ESCLUSIVAMENTE in formato JSON con la seguente struttura: { "packages": { "portfolio": { "name": "Portfolio Builder", "basePrice": <numero>, "description": "<testo>", "includedServices": ["<servizio 1>", "..."] }, "essenziale": { "name": "Essenziale", "basePrice": <numero>, "description": "<testo>", "includedServices": ["<servizio 1>", "..."] }, "standard": { "name": "Standard", "basePrice": <numero>, "description": "<testo>", "includedServices": ["<servizio 1>", "..."] }, "premium": { "name": "Premium", "basePrice": <numero>, "description": "<testo>", "includedServices": ["<servizio 1>", "..."] } }, "extras": { "extra1": { "name": "<nome extra>", "price": <numero>, "description": "<descrizione>" }, "extra2": { ... } } }`;
                const result = await callGeminiAPI(prompt, true);
                if (result.error || !result.packages) {
                    renderAiPricingForm(document.getElementById('step-3'), description);
                    document.getElementById('ai-price-result').innerHTML = `<p class="text-red-400">${result.error || "L'AI non è riuscita a generare i pacchetti. Riprova con una descrizione diversa."}</p>`;
                } else {
                    state.aiGeneratedService = result;
                    renderPackages(document.getElementById('step-3'), result);
                }
            };

            const recalculateQuoteFromDOM = () => {
                const printableArea = document.getElementById('printable-area');
                if (!printableArea) return;
                let basePrice = 0, extraTotal = 0, costTravel = 0, costRental = 0, costOther = 0;
                const getPrice = (el) => parseFloat(el.innerText.replace(/[^\d.,-]/g, '').replace(',', '.')) || 0;
                const basePriceEl = printableArea.querySelector('[data-price-type="base"]');
                if (basePriceEl) basePrice = getPrice(basePriceEl);
                printableArea.querySelectorAll('[data-price-type="extra"]').forEach(el => extraTotal += getPrice(el));
                const travelEl = printableArea.querySelector('[data-price-type="cost-travel"]'); if(travelEl) costTravel = getPrice(travelEl);
                const rentalEl = printableArea.querySelector('[data-price-type="cost-rental"]'); if(rentalEl) costRental = getPrice(rentalEl);
                const otherEl = printableArea.querySelector('[data-price-type="cost-other"]'); if(otherEl) costOther = getPrice(otherEl);
                const serviceSubtotal = basePrice + extraTotal;
                const costsSubtotal = costTravel + costRental + costOther;
                const finalTotal = serviceSubtotal + costsSubtotal;
                const serviceSubtotalEl = document.getElementById('quote-service-subtotal'); if(serviceSubtotalEl) serviceSubtotalEl.innerText = `€ ${serviceSubtotal.toFixed(2)}`;
                const costsSubtotalEl = document.getElementById('quote-costs-subtotal'); if(costsSubtotalEl) costsSubtotalEl.innerText = `€ ${costsSubtotal.toFixed(2)}`;
                const finalTotalEl = document.getElementById('quote-final-total'); if(finalTotalEl) finalTotalEl.innerText = `€ ${finalTotal.toFixed(2)}`;
            };

            const renderAiAssistantModal = () => {
                const container = document.getElementById('gemini-modal');
                container.innerHTML = `
                <div class="bg-secondary w-full max-w-3xl rounded-lg shadow-xl p-8">
                     <div class="flex justify-between items-start mb-6">
                        <h2 class="text-3xl font-display">✨ Assistente AI Unificato</h2>
                        <button class="text-2xl text-gray-500 hover:text-white close-modal-btn no-print">&times;</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="font-display text-lg text-accent mb-2">Idee Creative</h3>
                            <input type="text" id="ai-assistant-keywords" placeholder="Es: Avvocato, serio, moderno..." class="input-field w-full mb-2">
                            <button id="ai-assistant-creative-btn" class="btn btn-secondary w-full">Genera Idee</button>
                        </div>
                        <div>
                            <h3 class="font-display text-lg text-accent mb-2">Messaggio per Cliente</h3>
                             <p class="text-sm text-secondary mb-2 h-10">Genera un messaggio basato sul preventivo attuale.</p>
                             <button id="ai-assistant-email-btn" class="btn btn-secondary w-full">Genera Messaggio</button>
                        </div>
                        <div class="md:col-span-2">
                             <h3 class="font-display text-lg text-accent mb-2">Vademecum Tecnico</h3>
                             <p class="text-sm text-secondary mb-2 h-10">Crea una guida personalizzata per questo shooting.</p>
                             <button id="ai-assistant-vademecum-btn" class="btn btn-secondary w-full">Genera Vademecum</button>
                        </div>
                    </div>
                    <div id="gemini-content-wrapper" class="mt-6">
                        <div id="gemini-content" class="h-96 overflow-y-auto p-4 bg-gray-900 rounded-md">Seleziona un'opzione per iniziare.</div>
                        <button id="copy-gemini-content-btn" class="btn btn-primary mt-4 w-full no-print hidden"><i class="fas fa-copy mr-2"></i>Copia Testo</button>
                    </div>
                </div>`;
                container.classList.remove('hidden');
            };

            const handleSaveConfig = () => {
                CONFIG.photographerName = document.getElementById('config-name').value;
                CONFIG.homeAddress = document.getElementById('config-address').value;
                CONFIG.costPerKm = parseFloat(document.getElementById('config-cost-km').value);
                CONFIG.equipment = document.getElementById('config-equipment').value;
                localStorage.setItem('photographerConfig', JSON.stringify(CONFIG));
                document.getElementById('config-modal').classList.add('hidden');
                document.getElementById('user-name-display').textContent = CONFIG.photographerName.split(' ')[0];
                alert('Configurazione salvata!');
            };

            const loadConfig = () => {
                const savedConfig = localStorage.getItem('photographerConfig');
                if (savedConfig) {
                    CONFIG = JSON.parse(savedConfig);
                }
                 document.getElementById('user-name-display').textContent = CONFIG.photographerName.split(' ')[0];
            };

            const saveCustomizationData = () => {
                const clientNameEl = document.getElementById('client-name');
                const quoteTitleEl = document.getElementById('quote-title');
                if (clientNameEl) state.customizationData.clientName = clientNameEl.value;
                if (quoteTitleEl) state.customizationData.quoteTitle = quoteTitleEl.value;
            };
            
            // --- EVENT LISTENERS ---
            document.addEventListener('click', (e) => {
                if (e.target.closest('#step-1 .card.interactive')) { handleServiceSelect(e.target.closest('#step-1 .card.interactive').dataset.key); return; }
                if (e.target.closest('#step-2 .card.interactive')) { handleClientProfileSelect(e.target.closest('#step-2 .card.interactive').dataset.key); return; }
                if (e.target.closest('.package-select-btn')) { handlePackageSelect(e.target.closest('.package-select-btn').dataset.key); return; }
                if (e.target.closest('.add-extra-btn')) { handleAddExtra(e.target.closest('.add-extra-btn').dataset.key); return; }
                if (e.target.closest('.remove-extra-btn')) { handleRemoveExtra(e.target.closest('.remove-extra-btn').dataset.key); return; }
                if (e.target.closest('[data-step]')) { const targetStep = parseInt(e.target.closest('[data-step]').dataset.step, 10); if (targetStep < state.currentStep) goToStep(targetStep); return; }
                if (e.target.closest('.back-btn')) { goToStep(state.currentStep - 1); return;}
                if (e.target.closest('#open-ai-assistant-btn')) { renderAiAssistantModal(); return; }
                if (e.target.closest('.close-modal-btn')) { e.target.closest('.modal').classList.add('hidden'); return; }
                if (e.target.closest('#generate-quote-btn')) { saveCustomizationData(); renderQuoteModal(); return; }
                if (e.target.closest('#calculate-ai-price-btn')) { handleCalculateAiPrice(); return; }
                if (e.target.closest('#recalculate-ai-btn')) { renderAiPricingForm(document.getElementById('step-3'), document.getElementById('ai-job-description')?.value || ''); return; }
                if (e.target.closest('#ai-assistant-email-btn')) { handleGenerateEmail(); return; }
                if (e.target.closest('#ai-assistant-creative-btn')) { handleGenerateCreativeBrief('gemini-content'); return; }
                if (e.target.closest('#ai-assistant-vademecum-btn')) { handleGenerateVademecum('gemini-content'); return; }
                if (e.target.closest('#config-btn')) { renderConfigModal(); return; }
                if (e.target.closest('#save-config-btn')) { handleSaveConfig(); return; }
                if (e.target.closest('#copy-gemini-content-btn')) { 
                    const content = document.getElementById('gemini-content').innerText;
                    navigator.clipboard.writeText(content).then(() => alert('Testo copiato!'));
                }
            });
            document.addEventListener('input', (e) => { 
                if (e.target.closest('.cost-input')) { handleCostUpdate(); }
                if(e.target.closest('#quote-modal-content [contenteditable="true"]')) { recalculateQuoteFromDOM(); }
                if (e.target.matches('#client-name, #quote-title')) { saveCustomizationData(); }
            });

            // --- INITIALIZE ---
            const initialize = () => {
                loadConfig();
                renderStepper();
                renderServices();
            };
            initialize();
        });
    </script>
</body>
</html>
